services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template_local
      POSTGRES_DB: template_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U template -d template_dev']
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:17
    profiles: ['test']
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template_test
      POSTGRES_DB: template_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U template -d template_test']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
